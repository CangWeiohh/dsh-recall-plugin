name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests + pack layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dev deps only
        # 项目 peerDeps 是私有 @deepseek-ai 包（CI 不可得），--legacy-peer-deps
        # 跳过、只装 devDependencies（vitest）；发布仍走现有手动流程。
        run: npm ci --legacy-peer-deps
      - name: Unit tests
        # 单测里的 package-layout.test.js 已跑 npm pack --dry-run 断言包内容，
        # 无需单独 shell 步骤（计划原文：测试形式比 shell 步骤更可移植）。
        run: npm test